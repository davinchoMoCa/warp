# Moca Warp: compila los instaladores de Windows (y más adelante Linux) cuando la Mac
# publica una versión con script/moca/release, y los adjunta al GitHub Release del tag.
#
# Con workflow_dispatch compila la rama elegida y deja el instalador como artifact del run
# (sirve para probar que un cambio no rompe Windows); con "publicar" lo adjunta además al
# Release de la versión de app/Cargo.toml, para versiones cuyo tag no disparó el workflow.

name: Moca Warp release

# Ya no corre en cada tag: el instalador se compila en robcod14 (instalar.ps1 -Compilar -Pull
# -Publicar). Esto queda de respaldo, a mano desde la pestaña Actions.
on:
  workflow_dispatch:
    inputs:
      publicar:
        description: Adjuntar el instalador al Release vX.Y.Z de app/Cargo.toml (lo crea si no existe)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: moca-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path app\Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "El tag $env:GITHUB_REF_NAME no coincide con app/Cargo.toml (v$version)."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Rust (versión de rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Dependencias de build
        shell: pwsh
        run: |
          choco install protoc -y --no-progress
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          "${env:ProgramFiles(x86)}\Inno Setup 6" >> $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: moca-windows-release
          cache-on-failure: true

      - name: cargo-about
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-about -ErrorAction SilentlyContinue)) {
            cargo install cargo-about --locked --features cli
          }

      - name: Compilar e instalador
        shell: pwsh
        run: |
          $env:GIT_RELEASE_TAG = 'v${{ steps.version.outputs.version }}'
          ./script/windows/bundle.ps1 -CHANNEL oss
          if (-not $?) { throw 'bundle.ps1 falló.' }
          $out = "MocaWarp-${{ steps.version.outputs.version }}-Windows-x64-Setup.exe"
          Move-Item script\windows\Output\MocaWarpSetup.exe $out

      - name: Subir al Release
        if: github.ref_type == 'tag' || inputs.publicar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ steps.version.outputs.version }}'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "Moca Warp $tag" --notes "Moca Warp $tag"
          }
          gh release upload $tag "MocaWarp-${{ steps.version.outputs.version }}-Windows-x64-Setup.exe" --repo $env:GITHUB_REPOSITORY --clobber

      - name: Guardar instalador (prueba manual)
        if: github.ref_type != 'tag' && !inputs.publicar
        uses: actions/upload-artifact@v4
        with:
          name: MocaWarp-${{ steps.version.outputs.version }}-Windows-x64-Setup
          path: MocaWarp-${{ steps.version.outputs.version }}-Windows-x64-Setup.exe
          retention-days: 7
